set -g @plugin 'sainnhe/tmux-fzf'

set -g mouse on

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --color 'fg:#c1c1c1,bg:-1,hl:#7799bb,fg+:#f1f1f1,bg+:#222222,hl+:#7799bb,gutter:-1' \
    --color 'info:#505050,prompt:#5f8787,pointer:#5f8787,marker:#999999,spinner:#999999,header:#505050' \
    --color 'border:#505050,label:#5f8787,preview-border:#505050,separator:#222222,scrollbar:#505050' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Start windows index at 1
set -g base-index 1

# Start panes index at 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete
set-option -g renumber-windows on

# Toggle between two active panes
bind-key C-a last-pane

# Clipboard: send tmux copies to the macOS clipboard (OSC 52 via Ghostty + pbcopy fallback)
set -g set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard'
set -g allow-passthrough on
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi v send -X begin-selection

# Theme: Black Metal (Immortal), matching Ghostty and Neovim
# Palette from metalelf0/black-metal-theme-neovim extras/tmux/immortal.conf
set -g status-style "bg=default,fg=#c1c1c1"
set -g status-left-style "bg=default,fg=#5f8787"
set -g status-right-style "bg=default,fg=#505050"
set -g window-status-style "bg=default,fg=#505050"
set -g window-status-current-style "bg=#222222,fg=#7799bb,bold"
set -g window-status-activity-style "bg=default,fg=#aaaaaa"
set -g window-status-bell-style "bg=default,fg=#5f8787"
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#5f8787"
set -g popup-style "bg=default,fg=#c1c1c1"
set -g popup-border-style "fg=#505050"
set -g popup-border-lines rounded
set -g message-style "bg=#222222,fg=#f1f1f1"
set -g message-command-style "bg=#222222,fg=#7799bb"
set -g mode-style "bg=#222222,fg=#f1f1f1"
set -g copy-mode-match-style "bg=#556677,fg=#000000"
set -g copy-mode-current-match-style "bg=#5f8787,fg=#000000"
set -g clock-mode-colour "#5f8787"
